[package]
name = "python-spu-oracle"
version = "0.1.0"
edition = "2024"

# Its own workspace: the oracle is not a member of the tree's, per python-spu-Spec
# section 2, and without this table the root workspace would claim it.
[workspace]

# The workspace crates at a pinned commit, per python-spu-Spec section 2. Moving the
# pin is its own act, carrying the conformance suite's result at the new commit.
[dependencies]
weaver-spu = { git = "https://github.com/toddwbucy/WeaverTools", rev = "f22bf08f1cc3545c561dc4471215aa322c751128", default-features = false }
weaver-types = { git = "https://github.com/toddwbucy/WeaverTools", rev = "f22bf08f1cc3545c561dc4471215aa322c751128" }
weaver-traits = { git = "https://github.com/toddwbucy/WeaverTools", rev = "f22bf08f1cc3545c561dc4471215aa322c751128" }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
