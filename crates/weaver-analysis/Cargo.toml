[package]
name = "weaver-analysis"
version = "0.1.0"
edition = "2024"

# The dependency set is four crates and no internal one, per
# weaver-analysis-Spec section 1: this crate stands outside the agent and both
# of its seams draw their whole vocabulary from documents rather than from
# types, so no weaver-* dependency appears here on purpose.
# conforms: analysis-no-internal-dependency
# conforms: analysis-no-runtime-no-socket-crate
# conforms: analysis-no-crate-depends-on-it
# And no workspace crate depends on this one, the operator's condition of
# 2026-09-26 for it staying here: tests/manifest.rs reads every member's
# declared dependencies.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The format reader section 5's reading elects, and never an engine: it
# answers tensors from the container section 3 elected, so the lens and the
# weights its unembedding needs are read without an inference runtime. The
# same crate weaver-spu links for the native backend's weights.
safetensors = "0.7"
# The digest the manifest names, recomputed rather than trusted: an
# identity check written here would be this crate's approximation of a
# standard. Already in this workspace's resolved tree.
sha2 = "0.10"
# The declaration derive writes, per weaver-types-Spec section 2, built as a
# typed value and serialized here so no member crosses as hand-written text.
# The same crate weaver-types parses the declaration with, already in this
# workspace's resolved tree, taking serde and display to write and no parser.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "display"] }

[dev-dependencies]
# The tests read a derived declaration back as the TOML value it is, so an
# assertion reads a member's value rather than one spelling of it. The parser
# is the tests' alone: the binary writes a declaration and never reads one.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "display", "parse"] }
